<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego para el viaje a Florencia: lecturas, tests y misiones para cada día, con florines de oro, rangos y tesoros.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Florencia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6EAE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1524" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Misión Florencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Della+Respira&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a Renaissance workshop ledger on a phone. Stone ground, lapis ink, lily red, florin gold.
   Sticky player bar + mission tabs on top, one reading column below, big tap targets. */
:root{
  --stone:#E6EAE8; --paper:#F8F9F7; --ink:#18213A; --muted:#566072; --line:#C9D0CE;
  --lapis:#22468C; --lapis-soft:#DCE4F3; --lily:#B3262C; --lily-soft:#F5DEDF;
  --gold:#9C6F12; --gold-soft:#F4E7C6; --good:#2B6E3F; --good-soft:#DCEFE1; --on-lapis:#FFFFFF;
  --night:#1B2747; --star:#F6E7B8; --velvet:#16203B; --velvet2:#2E3E6B; --frame:#C9A04A;
  --display:"Della Respira", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stone:#0F1524; --paper:#172036; --ink:#ECE9E0; --muted:#A3ACBD; --line:#2C3754;
  --lapis:#93B2F0; --lapis-soft:#22305A; --lily:#F07A7D; --lily-soft:#4A2228;
  --gold:#E4B954; --gold-soft:#3D3217; --good:#7FD39A; --good-soft:#1C3A28; --on-lapis:#0F1524; color-scheme:dark}}
:root[data-theme="dark"]{
  --stone:#0F1524; --paper:#172036; --ink:#ECE9E0; --muted:#A3ACBD; --line:#2C3754;
  --lapis:#93B2F0; --lapis-soft:#22305A; --lily:#F07A7D; --lily-soft:#4A2228;
  --gold:#E4B954; --gold-soft:#3D3217; --good:#7FD39A; --good-soft:#1C3A28; --on-lapis:#0F1524; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--stone);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within,summary:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Header */
header{padding-block:22px 4px}
.title-row{display:flex;align-items:center;gap:14px}
.coin{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#F7DE8E,#D4A433 55%,#9C6F12);box-shadow:inset 0 0 0 3px #B8892B,inset 0 0 0 6px #E9C463,0 2px 0 #7A5610;color:#5A3F08}
.coin svg{width:28px;height:28px}
h1{font-size:clamp(32px,9vw,48px);line-height:1.05}
.tag{color:var(--muted);margin:12px 0 0;max-width:52ch}

/* Sticky player + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--stone);border-bottom:1px solid var(--line);margin-top:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stone)}
.me{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding-top:10px}
.pname{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.florins{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);white-space:nowrap;font-size:18px}
.rank{font-size:14px;color:var(--muted);grid-column:1/-1}
.bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px 8px;min-height:48px;justify-content:center}
.tab b{font-size:15px;line-height:1.2}
.tab small{font-size:12px;color:var(--muted);line-height:1.2}
.tab[aria-current="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.tab[aria-current="true"] small{color:var(--on-lapis);opacity:.85}
.tab.done b::after{content:" \2713";color:var(--good)}
.tab[aria-current="true"].done b::after{color:var(--on-lapis)}

/* Welcome */
.welcome{margin-top:18px;background:var(--paper);border:2px solid var(--lapis);border-radius:14px;padding:18px;display:grid;gap:12px}
.welcome p{margin:0}
.welcome label{display:grid;gap:6px;font-weight:700}
.welcome input,.panel input{font:inherit;font-size:18px;color:var(--ink);background:var(--stone);border:1.5px solid var(--line);border-radius:10px;padding:12px}

/* Mission */
main{padding-block:24px calc(60px + env(safe-area-inset-bottom,0px))}
.mhead{display:flex;gap:16px;align-items:center}
.wax{width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:12px;line-height:1.1;padding:8px;
  background:var(--lily);color:#FFF6F0;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.18)}
.wax.unearned{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none}
.mhead h2{font-size:clamp(26px,7vw,38px);line-height:1.1;margin-top:4px}
.intro{margin:16px 0 0;max-width:65ch}
.when{display:inline-block;margin-top:14px;background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:15px}

section{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:16px}
.sec-head h3{font-size:25px}
.sec-head span{color:var(--muted);font-size:15px}

.read{display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h4{margin:0 0 6px;font-size:19px;line-height:1.3}
.card p{margin:0;max-width:65ch}
.card p+p{margin-top:8px}
.fact{margin-top:10px!important;font-size:15px;color:var(--lapis);font-weight:700}

/* Quiz */
.quiz{display:grid;gap:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.q.solved{border-color:var(--good)}
.qn{display:flex;justify-content:space-between;gap:10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qn .won{color:var(--gold);letter-spacing:0;text-transform:none;font-size:15px}
.qt{font-weight:700;font-size:18px;margin:6px 0 12px;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;background:var(--stone);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;min-width:0}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--lapis)}}
.opt:active:not(:disabled){border-color:var(--lapis);background:var(--lapis-soft)}
.opt.wrong{background:var(--lily-soft);border-color:var(--lily);text-decoration:line-through;color:var(--muted);cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);font-weight:700;cursor:default}
.opt:disabled:not(.wrong):not(.right){opacity:.6;cursor:default}
.x{margin:12px 0 0;padding:10px 12px;background:var(--good-soft);border-radius:8px;font-size:16px}
.hint{margin:10px 0 0;color:var(--lily);font-size:15px;font-weight:700}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:nudge .3s}

/* Quests */
.quests{display:grid;gap:10px}
.quest{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.quest input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;margin-top:2px;color:transparent;font-weight:700}
.quest.got{background:var(--gold-soft);border-color:var(--gold)}
.quest.got .box{background:var(--gold);color:var(--paper)}
.where{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lapis);font-weight:700}
.qtext{min-width:0}
.pts{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);white-space:nowrap}
.ans{margin-top:8px;font-size:15px}
.ans summary{color:var(--muted);cursor:pointer;padding-block:4px}
.ans p{margin:6px 0 0}

.complete{margin-top:36px;padding:18px;border-radius:14px;background:var(--lapis-soft);display:flex;gap:14px;align-items:center}
.complete p{margin:0;max-width:60ch}
.next{margin-top:12px;background:var(--lapis);color:var(--on-lapis);border:0;border-radius:999px;padding:12px 20px;font-weight:700;min-height:48px}

.foot{margin-top:28px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;text-decoration:underline;color:var(--muted)}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;display:grid;gap:10px}
.panel p{margin:0}
.panel label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.panel textarea{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;color:var(--ink);background:var(--stone);border:1.5px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;resize:vertical}
.panel .err{color:var(--lily);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--lapis);color:var(--on-lapis);border:0;border-radius:999px;padding:12px 20px;font-weight:700;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--lily);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--stone);padding:12px 18px;border-radius:16px;font-weight:700;transition:.25s;pointer-events:none;z-index:20;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Illustrations: line drawings built from the same tokens, so they follow the theme */
.hero{margin:18px 0 0;border-radius:14px;overflow:hidden;background:var(--lapis-soft);border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:auto}
.card figure{margin:-16px -18px 14px;padding:12px 12px 8px;background:var(--stone);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.card figure svg{display:block;width:100%;max-width:320px;height:auto}
.card figcaption{font-size:13px;color:var(--muted);text-align:center;max-width:42ch;line-height:1.4}
.k{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.d{stroke-dasharray:4 4}
.thin{stroke-width:1;opacity:.55}
.g{fill:var(--gold)} .r{fill:var(--lily)} .b{fill:var(--lapis)} .p{fill:var(--paper)}
.gs{fill:var(--gold-soft)} .ls{fill:var(--lapis-soft)} .rs{fill:var(--lily-soft)} .gr{fill:var(--good)}
.ink{fill:var(--ink)} .night{fill:var(--night)} .star{fill:var(--star)}
.sr{stroke:var(--lily)} .sg{stroke:var(--gold)} .sb{stroke:var(--lapis)}
.water{fill:var(--lapis);opacity:.22}
.cr{color:var(--lily)} .cg{color:var(--gold)}
.t{font-family:var(--body);font-size:9px;font-weight:700;letter-spacing:.06em;fill:var(--ink);text-anchor:middle}
.tw{fill:#FFF8EC} .tsm{font-size:7.5px}
.coin use{color:#5A3F08}

/* Treasure cabinet */
.trophy-head{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.cabinet{display:grid;gap:14px;margin-top:8px}
.case{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.niche{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,var(--velvet2),var(--velvet) 72%);box-shadow:inset 0 0 0 3px var(--frame),inset 0 0 0 6px var(--velvet),inset 0 0 0 7px rgba(201,160,74,.5)}
.niche svg{position:absolute;inset:8%;width:84%;height:84%}
.niche .lock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:44px;color:rgba(246,231,184,.55)}
.case.locked .niche svg{filter:brightness(0) invert(1);opacity:.16}
.case.won .niche::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.case h4{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15}
.case .from{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lapis);font-weight:700;margin-top:2px}
.case p{margin:6px 0 0;font-size:15px}
.case.locked h4{color:var(--muted)}
.status{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.won .status{background:var(--good-soft);color:var(--good)}
.locked .status{background:var(--stone);color:var(--muted)}
.full{margin-top:20px;padding:18px;border-radius:14px;background:var(--gold-soft);border:2px solid var(--gold);text-align:center}
.full h3{font-size:26px}
.full p{margin:6px 0 0}
.finds{display:grid;gap:10px}
.find{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:15px}
.find .bar{grid-column:1/-1;margin-top:0}
@media (max-width:520px){.case{grid-template-columns:1fr;gap:12px}.niche{width:min(230px,100%);margin:0 auto}.stat b{font-size:24px}}
.niche.badge{width:96px;flex:none}
.niche.badge .lock{font-size:32px}
.niche.badge.locked svg{filter:brightness(0) invert(1);opacity:.16}
.niche.badge.won::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);animation:glint 5s ease-in-out infinite}
@media (max-width:560px){.niche.badge{width:80px}}
@media (prefers-reduced-motion:reduce){.case.won .niche::after,.niche.badge.won::after{display:none}}

@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .wax{width:64px;height:64px;font-size:10.5px;padding:6px}
  .complete{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Offline app: install card */
.install{margin-top:16px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.install p{margin:0}
.install .small{font-size:14px;color:var(--muted)}
</style>

const M=[
{id:"prep",tab:"Antes del viaje",sub:"Esta semana",seal:"Sello del Lirio",
 title:"Bienvenidos a la República",
 when:"Léelo durante la semana antes del viaje, poco a poco, en varias noches.",
 intro:"En 1450 Florencia era una de las ciudades más ricas del mundo, pero no tenía rey, ni puerto de mar, ni un gran ejército. Se gobernaba como una república de comerciantes. Antes de llegar, descubre quién mandaba, de dónde salía el dinero y por qué tantos grandes artistas acabaron en una ciudad tan pequeña.",
 read:[
  {h:"Una ciudad junto al Arno",t:["Los romanos fundaron Florentia en el año 59 a. C. como ciudad para soldados retirados. El nombre significa algo así como «la que florece». Aún se nota la cuadrícula de calles rectas romanas alrededor de la Piazza della Repubblica, que era el antiguo foro.","Hacia el año 1300 Florencia tenía unos 100.000 habitantes. Era una de las ciudades más grandes de Europa, más grande que Londres en aquella época."],fact:"De Barcelona a Florencia hay unos 800 km en línea recta."},
  {h:"Lana, bancos y el florín de oro",t:["Florencia se hizo rica convirtiendo lana en bruto en telas finas de colores, y después prestando dinero por toda Europa. En 1252 la ciudad acuñó el florín: unos 3,5 gramos de oro puro, con el lirio de Florencia en una cara y San Juan Bautista en la otra.","Los comerciantes de todas partes se fiaban de él, así que el florín se convirtió en la moneda de los grandes negocios, un poco como el dólar hoy."],fact:"Los oficios se organizaban en gremios, llamados Arti. Solo los miembros de un gremio podían tener cargos en el gobierno."},
  {h:"Los Médici",t:["Giovanni di Bicci de' Medici fundó el Banco Médici en 1397. Su hijo, Cosimo el Viejo, gobernó la ciudad desde la sombra a partir de 1434, sin que nunca lo coronaran. Su nieto, Lorenzo el Magnífico (1449–1492), escribía poemas, pagaba a artistas y acogió en su propia casa a un Miguel Ángel adolescente.","Más adelante la familia llegó a ser Gran Duque de Toscana y tuvo papas. La última de la familia, Anna Maria Luisa, firmó en 1737 el Pacto de Familia: dejó todos los tesoros de los Médici a Florencia con la condición de que nunca salieran de la ciudad. Por eso hoy puedes verlos."],fact:"El escudo de los Médici tiene bolas rojas (palle) sobre fondo de oro. El número cambió con el tiempo; la bola de arriba suele ser azul con lirios dorados."},
  {h:"Renacer",t:["Renacimiento quiere decir volver a nacer. Los artistas y pensadores florentinos redescubrieron las ideas de la antigua Grecia y Roma, estudiaron cuerpos reales y la luz real, y descubrieron las matemáticas de la perspectiva para que una pintura plana parezca profunda.","Los artistas aprendían en un taller llamado bottega. Un chico podía entrar con unos 10 a 13 años como garzone: barría el suelo y molía los colores, y poco a poco subía a aprendiz y luego a maestro. En este viaje, tú también empiezas como garzone."]},
  {h:"Símbolos que buscar",t:["El Marzocco es el león de Florencia; suele estar sentado con una pata sobre un escudo. El giglio es el lirio rojo sobre fondo blanco, la bandera de la ciudad. San Juan Bautista es el patrón, y su fiesta es el 24 de junio.","Dante Alighieri (1265–1321) escribió la Divina Comedia en toscano, la lengua de todos los días, en vez de en latín. Por eso se le considera el padre del italiano. Florencia lo desterró en 1302 y murió en Rávena."]}
 ],
 quiz:[
  {q:"¿Cómo llamaban los romanos a Florencia?",o:["Florentia","Arnópolis","Fiorella","Tuscania"],a:0,x:"Florentia, fundada en el 59 a. C. Significa algo así como «la que florece»."},
  {q:"¿Qué hizo rica a Florencia?",o:["Minas de oro en las colinas","La lana y la banca","Las especias de su puerto","Vender aceite a Roma"],a:1,x:"La lana y la banca. Florencia no tiene puerto de mar, así que el comercio iba por río y por carretera."},
  {q:"¿Cuándo se acuñó el primer florín de oro?",o:["1066","1252","1492","1600"],a:1,x:"En 1252. Pesaba unos 3,5 gramos de oro puro."},
  {q:"¿Quién fundó el Banco Médici en 1397?",o:["Lorenzo el Magnífico","Galileo Galilei","Giovanni di Bicci de' Medici","Cosimo I"],a:2,x:"Giovanni di Bicci. Su hijo Cosimo y su bisnieto Lorenzo convirtieron el dinero de la familia en poder."},
  {q:"¿Qué significa la palabra Renacimiento?",o:["Revolución","Volver a nacer","Edad de oro","Vuelta del rey"],a:1,x:"Volver a nacer: un renacer de las ideas de la antigua Grecia y Roma en el arte, la ciencia y la escritura."},
  {q:"¿Cómo se llama el león de Florencia?",o:["Leone d'Oro","Marzocco","Fiorino","Leo Primo"],a:1,x:"El Marzocco. El más famoso lo esculpió Donatello; el original está en el museo del Bargello."},
  {q:"¿Por qué se dice que Dante es el padre del italiano?",o:["Escribió el primer diccionario","Escribió la Divina Comedia en toscano y no en latín","Fue el primer rey de Italia","Inventó la imprenta"],a:1,x:"Escribir un gran poema en la lengua de la calle convirtió el toscano en el modelo del italiano moderno."},
  {q:"¿Quién consiguió que el arte de los Médici se quedara para siempre en Florencia?",o:["Miguel Ángel","Anna Maria Luisa de' Medici","Napoleón","El papa León X"],a:1,x:"Anna Maria Luisa, la última de los Médici, con el Pacto de Familia de 1737."}
 ],
 quests:[
  {id:"p1",where:"En casa",t:"Busca Florencia y el río Arno en un mapa de Italia. Luego encuentra Pisa, Siena y Roma, antiguas rivales y vecinas de Florencia.",pts:10},
  {id:"p2",where:"En casa",t:"Diseña tu propio escudo familiar como el de una familia de banqueros florentinos: elige colores, un símbolo y un lema en italiano o en latín.",pts:15},
  {id:"p3",where:"En casa",t:"Aprende cinco frases y úsalas en el viaje: buongiorno, grazie, per favore, quanto costa? y un gelato al pistacchio, per favore.",pts:10},
  {id:"p4",where:"En casa",t:"Mira un vídeo corto sobre cómo Brunelleschi construyó la cúpula de la catedral de Florencia. Prepárate para explicar uno de sus trucos.",pts:10},
  {id:"p5",where:"Haciendo la maleta",t:"Prepara tu kit de explorador: una libreta pequeña, un lápiz y una goma para dibujar lo que encuentres.",pts:5}
 ]},

{id:"fri",tab:"Día 1",sub:"Vie 27",seal:"Ladrillo de Brunelleschi",
 title:"La cúpula imposible",
 when:"Léelo el jueves por la noche, antes de volar.",
 intro:"Durante más de cien años la catedral de Florencia tuvo un agujero gigante donde debía ir la cúpula. Nadie en el mundo sabía cómo cerrarlo. Mañana subirás por dentro de la respuesta.",
 read:[
  {h:"Una catedral con un agujero en el techo",t:["Las obras de la catedral de Santa Maria del Fiore empezaron en 1296. Los planos mostraban una cúpula enorme de ocho lados, de unos 45 metros de ancho, pero nadie sabía construirla. Un arco normal necesita una estructura de madera debajo mientras se construye, y en toda la Toscana no había madera suficiente para llenar un hueco así.","Así que, durante décadas, la ciudad rezó bajo un techo abierto al cielo."]},
  {h:"El concurso de 1418",t:["La ciudad convocó un concurso. Lo ganó Filippo Brunelleschi, un orfebre que no había estudiado arquitectura. Diecisiete años antes había perdido otro concurso, el de las puertas del Baptisterio, contra Lorenzo Ghiberti. Esta vez ganó él, aunque la ciudad les obligó a trabajar juntos durante un tiempo, cosa que Brunelleschi odiaba.","Cuenta una historia famosa que retó a los jueces a poner un huevo de pie. Cuando todos fallaron, él lo golpeó contra la mesa para que la base quedara plana. Puede que sea una leyenda, pero a los florentinos les encanta."]},
  {h:"Cómo lo consiguió",t:["Brunelleschi construyó dos cúpulas, una dentro de la otra, con escaleras entre ambas. Ese es el camino por el que subirás. Colocó los ladrillos en espiga para que cada anillo nuevo quedara trabado con el de abajo, y la cúpula se sostenía sola mientras crecía, sin ninguna estructura de madera desde el suelo.","También inventó una grúa movida por bueyes que podía subir o bajar cargas sin tener que dar la vuelta a los animales. La cúpula se construyó entre 1420 y 1436 con más de 4 millones de ladrillos. La bola de cobre de arriba la colocó en 1471 el taller de Verrocchio, donde trabajaba un joven aprendiz llamado Leonardo da Vinci."],fact:"Para llegar arriba hay que subir 463 escalones."},
  {h:"El Baptisterio y sus puertas",t:["El Baptisterio, de ocho lados, es uno de los edificios más antiguos de la ciudad y está dedicado a San Juan Bautista. Allí bautizaron a Dante y a muchos Médici.","Ghiberti pasó unos 21 años haciendo un par de puertas de bronce y otros 27 con el siguiente. Miguel Ángel dijo que las puertas del este eran dignas de ser las Puertas del Paraíso, y el nombre se quedó. Las que hay ahora en el edificio son copias; las originales están en el museo de la catedral."],fact:"Ghiberti escondió su propio retrato, una cabeza calva, en el marco de las puertas."},
  {h:"Gremios, trigo y Santa Croce",t:["Orsanmichele empezó siendo un mercado de grano y se convirtió en iglesia. Cada gremio poderoso pagó una estatua para uno de los nichos de fuera, y competían por contratar a los mejores escultores. Donatello hizo San Jorge para el gremio de los armeros.","Santa Croce es la gran iglesia franciscana donde están enterrados Miguel Ángel, Galileo y Maquiavelo. También hay una tumba para Dante, pero está vacía: murió desterrado en Rávena, y Rávena nunca lo ha devuelto."]}
 ],
 quiz:[
  {q:"¿Por qué era tan difícil construir la cúpula?",o:["El mármol era demasiado caro","Era demasiado ancha para sostenerla con madera mientras se construía","El Papa prohibió las cúpulas","En Florencia no había ladrillos"],a:1,x:"Medía unos 45 metros de ancho. Una estructura de madera tan grande era imposible, así que Brunelleschi encontró una forma de construir sin ella."},
  {q:"¿A quién ganó Brunelleschi en el concurso de 1418?",o:["Miguel Ángel","Lorenzo Ghiberti","Leonardo da Vinci","Donatello"],a:1,x:"A Ghiberti, su viejo rival, que le había ganado el concurso de las puertas del Baptisterio en 1401."},
  {q:"¿Qué dibujo forman los ladrillos que traban la cúpula?",o:["Ajedrez","Espiga","Espiral","Panal"],a:1,x:"Espiga, en italiano spina di pesce, espina de pez. Búscala entre las dos cúpulas."},
  {q:"¿Qué movía la grúa de Brunelleschi?",o:["Ruedas de agua","Bueyes","Molinos de viento","Presos"],a:1,x:"Bueyes caminando en círculo. Sus engranajes permitían subir o bajar la carga sin dar la vuelta a los animales."},
  {q:"¿Cuántos escalones hay hasta lo alto de la cúpula?",o:["163","299","463","1.000"],a:2,x:"463 escalones, y no hay ascensor."},
  {q:"¿Quién llamó Puertas del Paraíso a las puertas del este del Baptisterio?",o:["Dante","Lorenzo de' Medici","Miguel Ángel","El Papa"],a:2,x:"Miguel Ángel, y el apodo se quedó."},
  {q:"¿Qué era Orsanmichele antes de ser iglesia?",o:["Una cárcel","Un mercado de grano","Un palacio real","Un banco"],a:1,x:"Un mercado y almacén de grano. El trigo se guardaba en los pisos de arriba."},
  {q:"¿De quién es la tumba vacía de Santa Croce?",o:["De Galileo","De Miguel Ángel","De Dante","De Maquiavelo"],a:2,x:"De Dante. Está enterrado en Rávena, donde murió desterrado en 1321."}
 ],
 quests:[
  {id:"f1",where:"Orsanmichele",t:"Da la vuelta por fuera y encuentra a San Jorge, la estatua de los armeros. Después busca el escudo de algún gremio encima de un nicho.",pts:10},
  {id:"f2",where:"Puertas del Baptisterio",t:"En las Puertas del Paraíso, encuentra el autorretrato de Ghiberti: un hombre calvo que mira hacia fuera desde el marco.",pts:15,ans:"Fíjate en las cabecitas dentro de círculos entre los paneles, más o menos a la altura de los ojos, hacia el centro de las puertas."},
  {id:"f3",where:"Dentro del Baptisterio",t:"Mira el techo de mosaico dorado. Encuentra la enorme figura de Cristo y luego el monstruo de abajo a la derecha que se traga a los pecadores.",pts:10},
  {id:"f4",where:"Museo de la catedral",t:"Encuentra las Puertas del Paraíso originales y elige tu panel favorito. ¿Sabrías decir qué historia de la Biblia cuenta?",pts:10},
  {id:"f5",where:"Museo de la catedral",t:"Encuentra la Piedad tardía de Miguel Ángel. Se dice que el anciano con capucha de arriba tiene la cara del propio Miguel Ángel.",pts:15},
  {id:"f6",where:"Museo de la catedral",t:"Encuentra las maquetas de madera de la linterna y la máscara mortuoria de Brunelleschi.",pts:10},
  {id:"f7",where:"Subida a la cúpula",t:"Entre la cúpula de dentro y la de fuera, busca los ladrillos en espiga en las paredes.",pts:15},
  {id:"f8",where:"Subida a la cúpula",t:"Desde la pasarela interior, encuentra un demonio en el Juicio Final que pintaron Vasari y Zuccari dentro de la cúpula.",pts:10},
  {id:"f9",where:"Arriba de la cúpula",t:"Desde la linterna, encuentra la torre del Palazzo Vecchio y la iglesia de Santa Croce. Cuenta cuántos puentes sobre el Arno puedes ver.",pts:10},
  {id:"f10",where:"Piazza Santa Croce",t:"Encuentra la estrella de David en lo alto de la fachada de Santa Croce. Luego pregunta a un adulto por qué puede estar ahí.",pts:15,ans:"La fachada no se terminó hasta 1863. La diseñó Niccolò Matas, un arquitecto judío, que la colocó ahí."},
  {id:"f11",where:"Mercado de Navidad",t:"Pide algo en italiano, con un buonasera y un grazie.",pts:10}
 ]},

{id:"sat",tab:"Día 2",sub:"Sáb 28",seal:"Concha de Botticelli",
 title:"Pintores, mecenas y la otra orilla",
 when:"Léelo el viernes por la noche, después de la cúpula.",
 intro:"Mañana a primera hora verás el gran tesoro de los Médici antes de que llegue la gente. Por la tarde cruzarás el puente más antiguo hacia la orilla donde todavía trabajan los artesanos de Florencia, y acabarás el día con monjes cantando en una colina.",
 read:[
  {h:"Oficinas llenas de tesoros",t:["Uffizi significa simplemente oficinas. El Gran Duque Cosimo I mandó a Giorgio Vasari construirlas a partir de 1560 para los funcionarios de la ciudad, y el piso de arriba se convirtió en una galería para los cuadros y estatuas de la familia.","En 1565 Vasari construyó también un pasillo cubierto de casi un kilómetro para que los Médici pudieran ir desde el palacio de gobierno, cruzando el río, hasta su casa en el Palazzo Pitti sin cruzarse con nadie por la calle."]},
  {h:"Aprender a pintar el mundo real",t:["Antes del año 1300, la pintura italiana mostraba santos planos, dorados y rígidos. Giotto lo cambió. Sus personajes pesan, pisan el suelo y sus caras muestran sentimientos.","En la primera sala grande puedes comparar tres Vírgenes enormes, de Cimabue, Duccio y Giotto. Se pintaron con pocos años de diferencia y se ve el cambio ocurriendo."]},
  {h:"Botticelli, Leonardo y Miguel Ángel",t:["Sandro Botticelli pintó El nacimiento de Venus hacia 1485: la diosa llega sobre una concha de vieira, empujada hasta la orilla por Céfiro, el dios del viento. Su Primavera está llena de flores; los botánicos han contado casi 200 plantas distintas.","Leonardo pintó La Anunciación con unos 20 años, cuando aún estaba en el taller de Verrocchio. Miguel Ángel pintó el Tondo Doni, un cuadro redondo para la boda de un comerciante. Y Caravaggio pintó la cabeza de Medusa gritando sobre un escudo de desfile de verdad, un regalo para el Gran Duque Fernando I."]},
  {h:"El puente de los orfebres",t:["El Ponte Vecchio, el Puente Viejo, se reconstruyó en 1345. Antes estaba lleno de carniceros y curtidores que tiraban los restos al río. En 1593 Fernando I, harto del olor bajo su pasillo privado, los sustituyó por orfebres y joyeros, que siguen allí.","En 1944 el ejército alemán, al retirarse, voló todos los demás puentes de Florencia, pero respetó este."]},
  {h:"Oltrarno y San Miniato",t:["Oltrarno quiere decir «al otro lado del Arno». Es la zona de los artesanos: encuadernadores, doradores y marqueros todavía trabajan en sus calles. Busca las buchette del vino, ventanitas en las paredes de los palacios por donde se vendía vino directamente a la calle. Se volvieron a usar durante la peste de 1630 y otra vez durante el covid.","En la colina, la iglesia de San Miniato al Monte se empezó en 1013. Según la leyenda, a San Miniato le cortaron la cabeza hacia el año 250, la recogió y subió andando hasta el lugar donde hoy está la iglesia. Su suelo de mármol, de 1207, tiene los signos del zodiaco."],fact:"Florencia fue capital de Italia de 1865 a 1871. El Piazzale Michelangelo se construyó en 1869 para la nueva capital."}
 ],
 quiz:[
  {q:"¿Qué significa Uffizi?",o:["Tesoros","Oficinas","Cuadros","Palacio"],a:1,x:"Oficinas. Se construyeron para los funcionarios que llevaban el gobierno de Cosimo I."},
  {q:"¿Qué pintor empezó a hacer figuras sólidas y reales en vez de planas y doradas?",o:["Giotto","Caravaggio","Rafael","Tiziano"],a:0,x:"Giotto, hacia el año 1300. Compara su Virgen con las de Cimabue y Duccio en la primera sala."},
  {q:"En El nacimiento de Venus, ¿sobre qué está Venus?",o:["Un delfín","Una nube","Una concha de vieira","Una roca"],a:2,x:"Sobre una concha de vieira, empujada hasta la orilla por Céfiro, el dios del viento."},
  {q:"¿Sobre qué pintó Caravaggio a Medusa?",o:["Un techo","Un escudo de desfile","Un plato","Un espejo"],a:1,x:"Sobre un escudo redondo, regalo para el Gran Duque Fernando I."},
  {q:"¿Por qué echó Fernando I a los carniceros del Ponte Vecchio?",o:["No pagaban impuestos","Por el olor, justo debajo de su pasillo","Por un incendio","Apoyaban a sus enemigos"],a:1,x:"Por el olor. En 1593 dio las tiendas a los orfebres."},
  {q:"¿Para qué servía el Corredor Vasariano?",o:["Para guardar vino","Para que los Médici cruzaran la ciudad sin ser vistos","Era una cárcel secreta","Para secar telas"],a:1,x:"Permitía a los Médici ir de los Uffizi y el Palazzo Vecchio al Palazzo Pitti sin salir a la calle."},
  {q:"Según la leyenda, ¿qué hizo San Miniato después de que le cortaran la cabeza?",o:["Se convirtió en paloma","Subió la colina llevando su propia cabeza","Voló a Roma","Se convirtió en león"],a:1,x:"Llevó su cabeza colina arriba hasta donde hoy está su iglesia. Es una leyenda, claro."},
  {q:"¿Cuándo fue Florencia la capital de Italia?",o:["Nunca","De 1865 a 1871","De 1494 a 1512","De 1946 a 1950"],a:1,x:"De 1865 a 1871, antes de que la capital pasara a Roma."}
 ],
 quests:[
  {id:"s1",where:"Uffizi, primeras salas",t:"Ponte delante de las tres Vírgenes gigantes de Cimabue, Duccio y Giotto. Vota: ¿cuál parece más una persona de verdad sentada en un trono de verdad?",pts:10},
  {id:"s2",where:"Uffizi, Uccello",t:"En La batalla de San Romano, encuentra las lanzas rotas tiradas en el suelo. Están colocadas en línea para lucir el nuevo truco de la perspectiva.",pts:10},
  {id:"s3",where:"Uffizi, Botticelli",t:"En la Primavera, cuenta todas las flores distintas que encuentres. ¿Llegas a 20?",pts:15},

{id:"sun",tab:"Día 3",sub:"Dom 29",seal:"Lente de Galileo",
 title:"Genio y poder",
 when:"Léelo el sábado por la noche, después de San Miniato.",
 intro:"Mañana va de tres tipos de poder: un escultor capaz de liberar a un gigante de un bloque de piedra, una familia tan rica que cubrió una capilla de piedras preciosas, y un científico que miró al cielo y se metió en líos por lo que vio.",
 read:[
  {h:"El Gigante",t:["Un enorme bloque de mármol de Carrara llevaba décadas tirado en el taller de la catedral después de que otros escultores lo abandonaran. Lo llamaban el Gigante. En 1501 Miguel Ángel, con 26 años, se atrevió con él y terminó el David en 1504.","Mide 5,17 metros. Está representado antes de luchar contra Goliat, tenso y concentrado, no después de ganar. Para los florentinos era el símbolo de su pequeña república frente a enemigos mucho más grandes. Estuvo delante del Palazzo Vecchio hasta 1873, cuando lo metieron dentro para protegerlo del tiempo."],fact:"Busca la honda sobre su hombro izquierdo. ¿Dónde está la piedra?"},
  {h:"Figuras atrapadas en la piedra",t:["En la galería verás los Prisioneros de Miguel Ángel, figuras que parecen luchar por salir del mármol. Eran para la tumba del papa Julio II y nunca se terminaron.","Miguel Ángel decía que la figura ya estaba dentro del bloque y que su trabajo era quitar lo que sobraba. Se ven las marcas de su cincel de dientes."]},
  {h:"Las Capillas de los Médici",t:["San Lorenzo era la iglesia de la familia Médici. Detrás, la Capilla de los Príncipes está cubierta de piedras semipreciosas pulidas, como lapislázuli, jaspe y coral, cortadas y encajadas como un puzle.","Miguel Ángel diseñó la Sacristía Nueva, con las tumbas de dos duques Médici y cuatro figuras recostadas: la Noche, el Día, la Aurora y el Crepúsculo. Lorenzo el Magnífico está enterrado en una tumba sencilla en la misma sala."],fact:"En 1530 Miguel Ángel se escondió de los Médici en un cuartito debajo de esta capilla y dibujó en sus paredes. Los dibujos no se descubrieron hasta 1975."},
  {h:"Galileo y las Estrellas Mediceas",t:["Galileo Galilei (1564–1642) nació en Pisa y enseñaba matemáticas. En 1609 oyó hablar de un catalejo holandés y construyó él mismo telescopios mejores. A principios de 1610 descubrió cuatro lunas que giraban alrededor de Júpiter.","Las llamó Estrellas Mediceas en honor a su antiguo alumno, el Gran Duque Cosimo II, y consiguió trabajo como científico de la corte. Más tarde defendió que la Tierra gira alrededor del Sol, algo que la Iglesia rechazaba. Tras un juicio en 1633, pasó sus últimos años en arresto domiciliario cerca de Florencia."]},
  {h:"La plaza del poder",t:["En la Piazza della Signoria los florentinos se reunían para decidir, protestar y celebrar. En 1497 el fraile Savonarola hizo quemar espejos, cartas, ropa fina y cuadros en una Hoguera de las Vanidades. Un año después la ciudad se volvió contra él y lo ejecutaron en esa misma plaza. Una placa redonda marca el lugar.","En la Loggia dei Lanzi está el Perseo de bronce de Cellini, con la cabeza de Medusa. Cellini contó que, al fundirlo, el metal empezó a enfriarse demasiado pronto, así que echó al horno sus propios platos y cuencos de peltre para salvarlo."]}
 ],
 quiz:[
  {q:"¿Cuántos años tenía Miguel Ángel cuando empezó el David?",o:["16","26","46","66"],a:1,x:"Tenía 26 años en 1501 y lo terminó tres años después."},
  {q:"¿Cuánto mide más o menos el David?",o:["2 metros","5 metros","9 metros","15 metros"],a:1,x:"5,17 metros. Sus manos y su cabeza son más grandes de lo normal para que se vea bien desde abajo."},
  {q:"¿Por qué metieron al David dentro en 1873?",o:["Lo vendieron","Para protegerlo del tiempo y los daños","Reformaron la plaza","Una tormenta lo tiró"],a:1,x:"La lluvia y la contaminación estropeaban el mármol. Ahora hay una copia delante del Palazzo Vecchio."},
  {q:"¿Qué nombre dio Galileo a las lunas de Júpiter?",o:["Luces Florentinas","Estrellas Mediceas","Los Cuatro Papas","Lunas del Lirio"],a:1,x:"Estrellas Mediceas, en honor a Cosimo II. Hoy las llamamos Ío, Europa, Ganímedes y Calisto."},
  {q:"¿De qué están cubiertas las paredes de la Capilla de los Príncipes?",o:["Pan de oro","Piedras semipreciosas","Azulejos pintados","Seda"],a:1,x:"De lapislázuli, jaspe, coral y otras piedras encajadas. La técnica se llama pietre dure."},
  {q:"¿Qué se quemó en la Hoguera de las Vanidades de Savonarola?",o:["Libros de ciencia","Lujos como espejos, cartas y ropa fina","El palacio de los Médici","Barcos"],a:1,x:"Lujos que él consideraba pecado, incluidos algunos cuadros."},
  {q:"¿Qué echó Cellini al horno para salvar su Perseo?",o:["Su espada","Sus platos y cuencos de peltre","Florines de oro","Sus zapatos"],a:1,x:"Sus platos de peltre, según cuenta él mismo en su autobiografía."},
  {q:"¿Qué representan las cuatro figuras de Miguel Ángel en la Sacristía Nueva?",o:["Las cuatro estaciones","Los cuatro vientos","La Noche, el Día, la Aurora y el Crepúsculo","Los cuatro evangelistas"],a:2,x:"Momentos del día: un recordatorio de que el tiempo pasa para todos, incluso para los duques."}
 ],
 quests:[
  {id:"u1",where:"Accademia, David",t:"Encuentra la honda sobre el hombro del David y averigua dónde tiene la piedra.",pts:15,ans:"En la mano derecha, que cuelga junto a su pierna."},
  {id:"u2",where:"Accademia, David",t:"Da la vuelta completa a su alrededor. ¿Desde qué lado parece más preocupado?",pts:5},
  {id:"u3",where:"Accademia, Prisioneros",t:"Encuentra las marcas del cincel en un Prisionero sin terminar. Dibuja una en tu libreta.",pts:10},
  {id:"u4",where:"Capilla de los Príncipes",t:"En la parte baja de las paredes, busca los escudos de ciudades toscanas hechos con piedras incrustadas. ¿Encuentras el lirio rojo de Florencia?",pts:15},
  {id:"u5",where:"Sacristía Nueva",t:"Encuentra la figura de la Noche. ¿Qué animal hay bajo su pierna doblada?",pts:15,ans:"Un búho. También lleva una luna y una estrella en la cabeza y tiene una máscara al lado."},
  {id:"u6",where:"Mercato Nuovo",t:"Frota el hocico del jabalí de bronce, Il Porcellino, y echa una moneda por la rejilla para volver algún día a Florencia.",pts:5},
  {id:"u7",where:"Museo Galileo",t:"Encuentra los telescopios de Galileo y la lente rota con la que descubrió las lunas de Júpiter.",pts:15},
  {id:"u8",where:"Museo Galileo",t:"Encuentra la gran esfera armilar, un modelo del universo con la Tierra en el centro.",pts:10},
  {id:"u9",where:"Museo Galileo",t:"Encuentra el dedo corazón de Galileo, guardado en un frasco de cristal como una reliquia. Pregunta por qué lo harían.",pts:10},
  {id:"u10",where:"Piazza della Signoria",t:"Encuentra la placa redonda en el suelo que marca dónde ejecutaron a Savonarola.",pts:15,ans:"Está delante de la fuente de Neptuno."},
  {id:"u11",where:"Loggia dei Lanzi",t:"Ponte detrás del Perseo y mira la parte de atrás de su casco. Se dice que Cellini escondió ahí una cara con barba, quizá la suya.",pts:15},
  {id:"u12",where:"Fachada del Palazzo Vecchio",t:"Búsqueda extra: encuentra la pequeña cara de un hombre tallada en la piedra de la pared derecha del Palazzo Vecchio. La leyenda dice que la talló Miguel Ángel.",pts:20,ans:"Está en la esquina junto a la entrada de Via della Ninna, a la altura de la cabeza, a la derecha de la puerta principal."}
 ]},

{id:"mon",tab:"Día 4",sub:"Lun 30",seal:"La llave escondida",
 title:"Los secretos del palacio",
 when:"Léelo el domingo por la noche. Última misión antes de volver a casa.",
 intro:"El Palazzo Vecchio es el ayuntamiento desde hace más de 700 años, y lo sigue siendo. Mañana entrarás dentro de sus muros, por escaleras escondidas, hasta el estudio secreto de un príncipe al que le encantaba la alquimia.",
 read:[
  {h:"Una fortaleza para una república",t:["El palacio se empezó en 1299 como fortaleza del gobierno, con una torre de 94 metros. Los jefes de la ciudad, los Priori, tenían que vivir dentro durante sus dos meses de mandato y casi no podían salir, para que nadie pudiera sobornarlos ni amenazarlos.","Cuando Cosimo I de' Medici se instaló aquí en 1540, mandó a Vasari que lo decorara de nuevo. Más tarde la familia se mudó al otro lado del río, al Palazzo Pitti, y este pasó a ser el Palacio Viejo: Palazzo Vecchio."]},
  {h:"El Salón de los Quinientos",t:["En 1494 los Médici fueron expulsados y Florencia creó un Gran Consejo de 500 ciudadanos. Necesitaban una sala lo bastante grande para reunirse: el Salone dei Cinquecento.","Hacia 1503 la ciudad contrató a Leonardo da Vinci y al joven Miguel Ángel, grandes rivales, para pintar batallas en sus paredes. Ninguno de los dos terminó. Décadas después Vasari cubrió las paredes con sus propias batallas. En una de ellas, una banderita verde dice Cerca trova: busca y encontrarás. Hay quien piensa que la pintura perdida de Leonardo está escondida detrás."]},
  {h:"Pasadizos dentro de los muros",t:["En 1342 Gualterio de Brienne, llamado el Duque de Atenas, se hizo con el poder en Florencia. Como la ciudad lo odiaba, construyó una escalera secreta y estrecha para escapar. En menos de un año el pueblo se rebeló y lo echó.","Francesco, el hijo de Cosimo I, adoraba la ciencia y la alquimia. Su Studiolo es una habitación pequeña sin ventanas cuyas paredes están cubiertas de cuadros que en realidad son puertas de armarios, donde escondía sus objetos raros y sus experimentos."]},
  {h:"Mapas y una máscara mortuoria",t:["La Sala de los Mapas tiene 53 mapas pintados en las puertas de armarios de madera, que muestran el mundo tal como lo conocían los Médici en el siglo XVI, y un enorme globo terráqueo en el centro.","También verás una máscara mortuoria que se dice que es de Dante, el poeta al que la ciudad desterró."]},
  {h:"Una última comida florentina",t:["El lampredotto es la comida callejera más antigua de la ciudad: el cuarto estómago de la vaca, cocido a fuego lento y servido en un panecillo con salsa verde. Da Nerbone lo sirve en el mercado desde 1872. Es para valientes. Pedir pasta también es una opción muy digna."]}
 ],
 quiz:[
  {q:"¿Por qué se llama Palacio Viejo?",o:["Es el edificio más antiguo de Italia","Los Médici se mudaron al Palazzo Pitti y este pasó a ser el viejo","Vivía en él un duque muy anciano","Lo construyeron los romanos"],a:1,x:"Cuando los Grandes Duques se fueron a vivir al Palazzo Pitti, este pasó a llamarse Palazzo Vecchio."},
  {q:"¿Por qué los Priori tenían que vivir dentro del palacio durante su mandato?",o:["Era más barato","Para que nadie pudiera sobornarlos ni amenazarlos","No tenían casa","Para vigilar el tesoro"],a:1,x:"Durante sus dos meses de mandato se quedaban dentro, a salvo de presiones."},
  {q:"El Salón de los Quinientos se llama así por:",o:["500 soldados","Un consejo de 500 ciudadanos","500 cuadros","Sus 500 ventanas"],a:1,x:"Por el Gran Consejo creado en 1494, cuando expulsaron a los Médici."},
  {q:"¿Qué dos rivales fueron contratados para pintar batallas en el salón?",o:["Giotto y Cimabue","Leonardo y Miguel Ángel","Botticelli y Caravaggio","Vasari y Cellini"],a:1,x:"Leonardo y Miguel Ángel, hacia 1503. Ninguno terminó."},
  {q:"¿Qué significa Cerca trova?",o:["Encuentra el tesoro","Busca y encontrarás","Mira arriba","Florencia para siempre"],a:1,x:"Busca y encontrarás. Está escrito en una banderita del fresco de Vasari."},
  {q:"¿Por qué construyó el Duque de Atenas una escalera secreta?",o:["Para esconder vino","Para escapar si el pueblo se rebelaba","Para llegar antes a la torre","Para espiar la cocina"],a:1,x:"Sabía que lo odiaban. El pueblo lo echó en menos de un año."},
  {q:"¿Qué escondía Francesco I en su Studiolo?",o:["Armas","Objetos raros y experimentos de alquimia","Cartas de amor","Un león"],a:1,x:"Detrás de las puertas pintadas guardaba tesoros, minerales y los instrumentos de sus experimentos."},
  {q:"¿Qué es el lampredotto?",o:["Un pastel dulce","Estómago de vaca cocido en un panecillo","Un tipo de anguila","Una bebida de limón"],a:1,x:"El cuarto estómago de la vaca: la comida callejera clásica de Florencia."}
 ],
 quests:[
  {id:"m1",where:"Patio del palacio",t:"Encuentra las vistas de ciudades austriacas pintadas en las paredes del patio. Se pintaron en 1565 para que Juana, la novia austriaca de Francesco, se sintiera como en casa.",pts:10},
  {id:"m2",where:"Salón de los Quinientos",t:"Encuentra la banderita verde con las palabras Cerca trova en el fresco de la batalla de Vasari. Vas a necesitar buena vista.",pts:20,ans:"En la pared este, en la Batalla de Marciano, en lo alto, hacia el centro. Si no la encuentras, pide al guía que te la señale."},
  {id:"m3",where:"Salón de los Quinientos",t:"Encuentra la estatua de Miguel Ángel, El genio de la Victoria: un joven arrodillado sobre un anciano.",pts:10},
  {id:"m4",where:"Pasadizos secretos",t:"En la escalera del Duque de Atenas, fíjate en lo estrecha que es. ¿Por qué se construiría así una vía de escape?",pts:10},
  {id:"m5",where:"Studiolo",t:"Descubre un cuadro que en realidad es la puerta de un armario secreto.",pts:15},
  {id:"m6",where:"Sala de los Mapas",t:"Encuentra España en los mapas pintados. ¿Sabes dónde estaría Barcelona?",pts:15},
  {id:"m7",where:"Palazzo Vecchio",t:"Encuentra la máscara mortuoria de Dante.",pts:10},
  {id:"m8",where:"Da Nerbone",t:"Reto para valientes: prueba el lampredotto. Con un bocado vale.",pts:15},
  {id:"m9",where:"De vuelta a casa",t:"Escribe una postal como si fueras un aprendiz del Renacimiento, contando a tu familia tu primera semana en un taller florentino.",pts:20}
 ]}
];

const PRIZES=[
 {m:"prep",k:"lily",name:"Sello del Lirio",desc:"Un sello de lacre rojo con el lirio de Florencia, como los que cerraban las cartas oficiales de la República."},
 {m:"fri",k:"brick",name:"Ladrillo de Brunelleschi",desc:"Uno de los más de 4 millones de ladrillos de la cúpula, colocado en espiga."},
 {m:"sat",k:"shell",name:"Concha de Botticelli",desc:"La concha de vieira sobre la que llega Venus, con una perla de regalo."},
 {m:"sun",k:"lens",name:"Lente de Galileo",desc:"La lente rota en su marco de marfil, con Júpiter y sus cuatro lunas dentro."},
 {m:"mon",k:"key",name:"La llave escondida",desc:"Una llave de oro con el lirio calado, para abrir los pasadizos secretos del palacio."}
];

function badge(m,got){const p=PRIZES.find(x=>x.m===m.id);
  return `<div class="niche badge ${got?"won":"locked"}" title="${esc(p.name)}"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(p.name)}${got?"":" (sin desbloquear)"}">${TREASURE[p.k]}</svg>${got?"":`<span class="lock" aria-hidden="true">?</span>`}</div>`}
function renderTreasure(){
  const t=total(),r=rankOf(t),won=PRIZES.filter(p=>sealed(M.find(m=>m.id===p.m))).length;
  const allQ=M.reduce((a,m)=>a+m.quests.length,0),gotQ=M.reduce((a,m)=>a+m.quests.filter(q=>S.quests[q.id]).length,0);
  let h=`<div class="trophy-head"><div><div class="eyebrow">Tu colección</div><h2 style="font-size:clamp(28px,7vw,40px);line-height:1.1;margin-top:4px">El tesoro del taller</h2></div>
   <p class="intro" style="margin:0">Cada misión guarda un tesoro. Para ganarlo, responde bien todas las preguntas de esa misión. Aquí puedes ver todo lo que has conseguido${S.name?", "+esc(S.name):""}.</p></div>
   <div class="stats"><div class="stat"><b>${t}</b><span>florines</span></div><div class="stat"><b>${won}/5</b><span>tesoros</span></div><div class="stat"><b>${gotQ}/${allQ}</b><span>hallazgos</span></div></div>
   <p class="when" style="margin-top:12px">Rango: <b>${RANKS[r][1]}</b>, ${esc(RANKS[r][2])}.</p>`;
  if(won===5)h+=`<div class="full"><h3>¡Colección completa!</h3><p>Has ganado los cinco tesoros. Ya eres digno del taller de los Médici.</p></div>`;
  h+=`<section><div class="sec-head"><h3>Vitrina de tesoros</h3><span>${won} de 5 ganados</span></div><div class="cabinet">`+
   PRIZES.map(p=>{const m=M.find(x=>x.id===p.m),ok=sealed(m),done=m.quiz.filter((q,i)=>(S.quiz[m.id+"-"+i]||{}).done).length;
     return `<article class="case ${ok?"won":"locked"}"><div class="niche"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(p.name)}">${TREASURE[p.k]}</svg>${ok?"":`<span class="lock" aria-hidden="true">?</span>`}</div>
      <div style="min-width:0"><h4>${esc(p.name)}</h4><div class="from">${esc(m.tab)} · ${esc(m.title)}</div>
      <p>${ok?esc(p.desc):`Responde bien las ${m.quiz.length} preguntas de esta misión para desbloquearlo.`}</p>
      <span class="status">${ok?"Ganado":`${done} de ${m.quiz.length} preguntas`}</span>
      ${ok?"":`<div><button class="next" type="button" data-m="${m.id}" style="margin-top:10px">Ir a la misión</button></div>`}</div></article>`}).join("")+`</div></section>`;
  h+=`<section><div class="sec-head"><h3>Hallazgos en Florencia</h3><span>${gotQ} de ${allQ}</span></div><div class="finds">`+
   M.map(m=>{const n=m.quests.filter(q=>S.quests[q.id]).length;return `<div class="find"><span>${esc(m.tab)} · ${esc(m.title)}</span><b class="pts">${n}/${m.quests.length}</b><span class="bar"><i style="width:${Math.round(n/m.quests.length*100)}%"></i></span></div>`}).join("")+`</div></section>`;
  document.getElementById("main").innerHTML=h;
}

/* ---------- state (one player per device) ---------- */
const KEY="mision-florencia-v1";
const fresh=()=>({name:"",quiz:{},quests:{},cur:"prep"});
let S=fresh();
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.quiz&&d.quests)S=Object.assign(fresh(),d)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const QPTS=[10,5,2];
const quizPts=rec=>(!rec||!rec.done)?0:QPTS[Math.min(rec.wrong.length,2)];
const QP={};M.forEach(m=>m.quests.forEach(q=>QP[q.id]=q.pts));
function total(){let t=0;for(const k in S.quiz)t+=quizPts(S.quiz[k]);for(const k in S.quests)if(S.quests[k])t+=QP[k]||0;return t}
function rankOf(t){let i=0;RANKS.forEach((r,j)=>{if(t>=r[0])i=j});return i}
const sealed=m=>m.quiz.every((q,i)=>(S.quiz[m.id+"-"+i]||{}).done);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const who=()=>S.name||"Tú";

/* ---------- render ---------- */
function renderMe(){
  const t=total(),r=rankOf(t),nx=RANKS[r+1];
  const pct=nx?Math.round((t-RANKS[r][0])/(nx[0]-RANKS[r][0])*100):100;
  document.getElementById("me").innerHTML=`<span class="pname">${esc(who())}</span><span class="florins">${t} florines</span>
    <span class="rank"><b>${RANKS[r][1]}</b>${nx?` · te faltan ${nx[0]-t} para ${nx[1]}`:" · el rango más alto de Florencia"}</span>
    <span class="bar"><i style="width:${pct}%"></i></span>`;
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=M.map(m=>`<button class="tab ${sealed(m)?"done":""}" type="button" data-m="${m.id}" aria-current="${m.id===S.cur}"><b>${m.tab}</b><small>${m.sub}</small></button>`).join("")+`<button class="tab" type="button" data-m="tesoro" aria-current="${S.cur==="tesoro"}"><b>Tesoro</b><small>${PRIZES.filter(p=>sealed(M.find(m=>m.id===p.m))).length} de 5</small></button>`;
  const a=document.querySelector('.tab[aria-current="true"]');if(a&&a.scrollIntoView)a.scrollIntoView({block:"nearest",inline:"center"});
}
function renderWelcome(){
  const s=document.getElementById("welcomeSlot");
  if(S.name){s.innerHTML="";return}
  s.innerHTML=`<form class="welcome" id="welcomeForm"><p><b>Antes de empezar:</b> escribe tu nombre. Así este móvil será tu libro de cuentas del taller.</p>
    <label for="nm">Tu nombre<input id="nm" maxlength="20" autocomplete="off" placeholder="Escribe tu nombre"></label>
    <button class="btn" type="submit">Empezar como garzone</button></form>`;
  document.getElementById("welcomeForm").onsubmit=e=>{e.preventDefault();const v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").focus();return}
    S.name=v;save();renderAll();toast(`¡Bienvenido al taller, ${v}!`)};
}
function renderMain(){
  if(S.cur==="tesoro"){renderTreasure();return}
  const m=M.find(x=>x.id===S.cur),idx=M.indexOf(m),got=sealed(m);
  const qDone=m.quiz.filter((q,i)=>(S.quiz[m.id+"-"+i]||{}).done).length;
  const found=m.quests.filter(q=>S.quests[q.id]).length;
  let h=`<div class="mhead">${badge(m,got)}<div style="min-width:0">
    <div class="eyebrow">${idx===0?"Misión de preparación":"Misión "+idx+" · "+m.sub+" de noviembre"}</div>
    <h2>${esc(m.title)}</h2></div></div>
    <figure class="hero">${art(ILL[m.id].hero[0],VB[ILL[m.id].hero[0]]||"0 0 400 160",ILL[m.id].hero[1])}</figure>
    <p class="intro">${esc(m.intro)}</p><span class="when">${esc(m.when)}</span>`;

  h+=`<section><div class="sec-head"><h3>Estudia</h3><span>Léelo antes del test</span></div><div class="read">`+
    m.read.map((r,ri)=>{const il=ILL[m.id].cards[ri];return `<article class="card">${il?`<figure>${art(il[0],VB[il[0]]||"0 0 200 110",il[1])}<figcaption>${esc(il[1])}</figcaption></figure>`:""}<h4>${esc(r.h)}</h4>${r.t.map(x=>`<p>${esc(x)}</p>`).join("")}${r.fact?`<p class="fact">${esc(r.fact)}</p>`:""}</article>`}).join("")+`</div></section>`;

  h+=`<section><div class="sec-head"><h3>Pon a prueba lo que sabes</h3><span>${qDone} de ${m.quiz.length} respondidas · 10 florines a la primera, 5 a la segunda</span></div><div class="quiz">`+
    m.quiz.map((q,i)=>{const k=m.id+"-"+i,rec=S.quiz[k]||{wrong:[]};
      return `<div class="q ${rec.done?"solved":""}" id="q-${k}"><div class="qn"><span>Pregunta ${i+1}</span>${rec.done?`<span class="won">+${quizPts(rec)} florines</span>`:""}</div>
      <div class="qt">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>{
        const w=rec.wrong.includes(j),r=rec.done&&j===q.a;
        return `<button type="button" class="opt ${w?"wrong":""} ${r?"right":""}" data-k="${k}" data-j="${j}" ${rec.done||w?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
      ${rec.done?`<p class="x">${esc(q.x)}</p>`:(rec.wrong.length?`<p class="hint">Casi. Repasa la lectura y vuelve a intentarlo.</p>`:"")}</div>`}).join("")+`</div></section>`;

  h+=`<section><div class="sec-head"><h3>Misiones sobre el terreno</h3><span id="foundCount">${found} de ${m.quests.length} encontradas</span></div><div class="quests">`+
    m.quests.map(q=>{const g=!!S.quests[q.id];return `<label class="quest ${g?"got":""}" for="c-${q.id}">
      <input type="checkbox" id="c-${q.id}" data-q="${q.id}" ${g?"checked":""}><span class="box" aria-hidden="true">&#10003;</span>
      <span class="qtext"><span class="where">${esc(q.where)}</span><br>${esc(q.t)}${q.ans?`<details class="ans"><summary>Pista para los mayores</summary><p>${esc(q.ans)}</p></details>`:""}</span>
      <span class="pts">+${q.pts}</span></label>`}).join("")+`</div></section>`;

  const nx=M[idx+1];
  h+=`<div class="complete">${badge(m,got)}<div><p>${got?`¡Has ganado el ${esc(m.seal)}!`:`Responde bien todas las preguntas para ganar el ${esc(m.seal)}. Las misiones sobre el terreno se marcan el mismo día.`}</p>
    ${nx?`<button class="next" type="button" data-m="${nx.id}">Siguiente: ${esc(nx.title)}</button>`:`<button class="next" type="button" data-m="tesoro">Ver mi tesoro</button>`}</div></div>`;
  document.getElementById("main").innerHTML=h;
}
function renderAll(){renderWelcome();renderMe();renderTabs();renderMain()}

/* ---------- interactions ---------- */
let tt;function toast(t,ms){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),ms||2200)}
const valid=id=>id==="tesoro"||!!M.find(m=>m.id===id);
function go(id,scroll){if(!valid(id))id="prep";S.cur=id;save();renderTabs();renderMain();
  if(scroll){const top=document.querySelector(".top");window.scrollTo({top:top.offsetTop,behavior:"smooth"})}
  if(location.hash!=="#"+id)history.replaceState(null,"","#"+id)}

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-m]");if(tb){go(tb.dataset.m,true);return}
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,j=+op.dataset.j,[mid,qi]=k.split("-"),m=M.find(x=>x.id===mid),q=m.quiz[+qi];
    const rec=S.quiz[k]||(S.quiz[k]={wrong:[],done:false});
    const before=rankOf(total());
    if(j===q.a){rec.done=true;save();renderMe();renderTabs();renderMain();toast(`¡Correcto! +${quizPts(rec)} florines`);
      if(sealed(m))setTimeout(()=>toast(`¡Has ganado el ${m.seal}! Míralo en Tesoro.`,3000),1300);}
    else{rec.wrong.push(j);save();renderMain();const el=document.getElementById("q-"+k);if(el)el.classList.add("shake");
      if(navigator.vibrate)try{navigator.vibrate(60)}catch(x){}}
    checkRank(before);
  }
});
document.addEventListener("change",e=>{
  const c=e.target.closest("input[data-q]");if(!c)return;
  const before=rankOf(total());S.quests[c.dataset.q]=c.checked;save();renderMe();
  c.closest(".quest").classList.toggle("got",c.checked);
  const m=M.find(x=>x.id===S.cur);
  document.getElementById("foundCount").textContent=`${m.quests.filter(q=>S.quests[q.id]).length} de ${m.quests.length} encontradas`;
  if(c.checked)toast(`¡Encontrado! +${QP[c.dataset.q]} florines`);
  checkRank(before);
});
function checkRank(b){const a=rankOf(total());if(a>b)setTimeout(()=>toast(`¡Subes de rango! Ahora eres ${RANKS[a][1]}: ${RANKS[a][2]}.`,3400),900)}

const slot=document.getElementById("panelSlot");
document.getElementById("editName").onclick=()=>{
  slot.innerHTML=`<form class="panel" id="nameForm"><label for="n0">Tu nombre<input id="n0" maxlength="20" autocomplete="off" value="${esc(S.name)}"></label>
    <div class="row"><button class="btn" type="submit">Guardar</button><button class="btn alt" type="button" id="cancelP">Cancelar</button></div></form>`;
  document.getElementById("nameForm").onsubmit=ev=>{ev.preventDefault();S.name=document.getElementById("n0").value.trim();save();slot.innerHTML="";renderAll();toast("Nombre guardado")};
  document.getElementById("cancelP").onclick=()=>slot.innerHTML="";
};
document.getElementById("resetBtn").onclick=()=>{
  slot.innerHTML=`<div class="panel"><p>¿Empezar de nuevo? Se borrarán todos los florines, respuestas y misiones de este móvil.</p>
    <div class="row"><button class="btn danger" type="button" id="doReset">Borrar todo</button><button class="btn alt" type="button" id="cancelP">Mantener mi progreso</button></div></div>`;
  document.getElementById("doReset").onclick=()=>{const n=S.name;S=fresh();S.name=n;save();slot.innerHTML="";renderAll();window.scrollTo({top:0});toast("Progreso borrado")};
  document.getElementById("cancelP").onclick=()=>slot.innerHTML="";
};
/* progress backup: a text code that can be pasted back on any device */
function exportCode(){const d={v:1,name:S.name,quiz:S.quiz,quests:S.quests};return "MF1-"+btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function importCode(txt){const m=String(txt).replace(/\s+/g,"").match(/MF1-([A-Za-z0-9+/=]+)/);if(!m)throw new Error("bad");
  const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!d||typeof d.quiz!=="object"||typeof d.quests!=="object")throw new Error("bad");return d}
function mergeProgress(d){
  for(const k in d.quiz){const a=S.quiz[k],b=d.quiz[k];if(!b||!Array.isArray(b.wrong))continue;
    if(!a||(!a.done&&b.done)||(a.done&&b.done&&b.wrong.length<a.wrong.length))S.quiz[k]={wrong:b.wrong.slice(),done:!!b.done}}
  for(const k in d.quests)if(d.quests[k])S.quests[k]=true;
  if(d.name&&!S.name)S.name=String(d.name).slice(0,20)}
document.getElementById("backupBtn").onclick=()=>{const code=exportCode();
  slot.innerHTML=`<div class="panel"><p><b>Tu código de progreso.</b> Cópialo y guárdalo, por ejemplo enviándotelo por WhatsApp. Con él puedes recuperar tus florines y tesoros en otro móvil o si se borra este.</p>
    <textarea id="codeOut" readonly rows="4">${code}</textarea>
    <div class="row"><button class="btn" type="button" id="copyCode">Copiar código</button><button class="btn alt" type="button" id="cancelP">Cerrar</button></div></div>`;
  const sel=()=>{const t=document.getElementById("codeOut");t.focus();t.select();try{t.setSelectionRange(0,t.value.length)}catch(e){}};
  document.getElementById("copyCode").onclick=()=>{
    try{navigator.clipboard.writeText(code).then(()=>toast("Código copiado"),()=>{sel();toast("Mantén pulsado el código para copiarlo")})}
    catch(e){sel();toast("Mantén pulsado el código para copiarlo")}};
  document.getElementById("cancelP").onclick=()=>slot.innerHTML="";
  slot.scrollIntoView({block:"nearest",behavior:"smooth"});
};
document.getElementById("restoreBtn").onclick=()=>{
  slot.innerHTML=`<form class="panel" id="restoreForm"><p><b>Recuperar progreso.</b> Pega aquí tu código. Se sumará a lo que ya tienes en este móvil; no se pierde nada.</p>
    <label for="codeIn">Código<textarea id="codeIn" rows="4" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="MF1-..."></textarea></label>
    <p class="err" id="codeErr" hidden>Ese código no es válido. Comprueba que lo has copiado entero, empezando por MF1-.</p>
    <div class="row"><button class="btn" type="submit">Recuperar</button><button class="btn alt" type="button" id="cancelP">Cancelar</button></div></form>`;
  document.getElementById("restoreForm").onsubmit=ev=>{ev.preventDefault();
    try{const d=importCode(document.getElementById("codeIn").value);mergeProgress(d);save();slot.innerHTML="";renderAll();toast(`Progreso recuperado: ${total()} florines`,3000)}
    catch(e){document.getElementById("codeErr").hidden=false}};
  document.getElementById("cancelP").onclick=()=>slot.innerHTML="";
  slot.scrollIntoView({block:"nearest",behavior:"smooth"});
};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.cur)go(h)});

function start(data){
  load();
  if(data&&data.S)S=Object.assign(fresh(),data.S);
  const h=location.hash.slice(1);if(h&&valid(h))S.cur=h;
  if(!valid(S.cur))S.cur="prep";
  renderAll();
}

/* ---------- offline app ---------- */
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderInstall()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;renderInstall();toast("¡Instalada! Ábrela desde el icono de tu pantalla.",3200)});
function renderInstall(){
  const s=document.getElementById("installSlot");if(!s)return;
  let dismissed=false;try{dismissed=localStorage.getItem(KEY+"-noinstall")==="1"}catch(e){}
  if(isStandalone()||dismissed){s.innerHTML="";return}
  const how=isIOS?`En Safari, toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y elige <b>Añadir a pantalla de inicio</b>.`
    :deferredPrompt?`Toca <b>Instalar</b> y tendrás un icono como cualquier otra app.`
    :`En Chrome, abre el menú <b>&#8942;</b> y elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.`;
  s.innerHTML=`<div class="install"><p><b>Instálala para jugar sin internet.</b> ${how}</p>
    ${isIOS?`<p class="small">En iPhone, juega siempre desde el icono: Safari y el icono guardan el progreso por separado.</p>`:""}
    <div class="row">${deferredPrompt?`<button class="btn" type="button" id="doInstall">Instalar</button>`:""}<button class="btn alt" type="button" id="noInstall">Ahora no</button></div></div>`;
  const b=document.getElementById("doInstall");
  if(b)b.onclick=async()=>{const p=deferredPrompt;deferredPrompt=null;try{p.prompt();await p.userChoice}catch(e){}renderInstall()};
  document.getElementById("noInstall").onclick=()=>{try{localStorage.setItem(KEY+"-noinstall","1")}catch(e){}renderInstall()};
}
function setOfflineNote(){const n=document.getElementById("saveNote");if(n)n.textContent="El progreso se guarda en este móvil. Lista para jugar sin internet ✓"}
if("serviceWorker" in navigator){
  const firstTime=!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("./sw.js")
    .then(()=>navigator.serviceWorker.ready)
    .then(()=>{setOfflineNote();if(firstTime)setTimeout(()=>toast("Lista para jugar sin internet",2800),2600)})
    .catch(()=>{});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
start({});
renderInstall();
</script>

</html>
